name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          ASSET_NAME="ppm_${{ matrix.goos }}_${{ matrix.goarch }}"
          BIN_FILENAME="ppm"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BIN_FILENAME="ppm.exe"
          fi

          # Taskfile과 동일한 LDFLAGS: 최적화(-s -w) + 버전 주입(-X)
          go build -ldflags="-s -w -X ppm/cmd.Version=${VERSION}" -o "$BIN_FILENAME" .
          
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "${ASSET_NAME}.zip" "$BIN_FILENAME"
          else
            tar -czvf "${ASSET_NAME}.tar.gz" "$BIN_FILENAME"
          fi

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ppm_*.tar.gz
            ppm_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
