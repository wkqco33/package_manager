name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: false

      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          ASSET_NAME="ppm_${{ matrix.goos }}_${{ matrix.goarch }}"
          BIN_FILENAME="ppm"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BIN_FILENAME="ppm.exe"
          fi

          # Taskfile과 동일한 LDFLAGS: 최적화(-s -w) + 버전 주입(-X)
          go build -trimpath -ldflags="-s -w -X github.com/wkqco33/package_manager/cmd.Version=${VERSION}" -o "$BIN_FILENAME" .

          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -q "${ASSET_NAME}.zip" "$BIN_FILENAME"
            sha256sum "${ASSET_NAME}.zip" > "${ASSET_NAME}.zip.sha256"
            unzip -tq "${ASSET_NAME}.zip"
          else
            tar -czf "${ASSET_NAME}.tar.gz" "$BIN_FILENAME"
            sha256sum "${ASSET_NAME}.tar.gz" > "${ASSET_NAME}.tar.gz.sha256"
            tar -tzf "${ASSET_NAME}.tar.gz" >/dev/null
          fi

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ppm_*.tar.gz
            ppm_*.zip
            ppm_*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release archive (Unix)
        if: matrix.goos != 'windows'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ppm_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

      - name: Attest release archive (Windows)
        if: matrix.goos == 'windows'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ppm_${{ matrix.goos }}_${{ matrix.goarch }}.zip
